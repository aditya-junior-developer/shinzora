<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Shinzora Admin</title>
  <meta name="description" content="Shinzora operations console. Administrator access only." />
  <meta name="theme-color" content="#08060d" />
  <link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
<link rel="preconnect" href="https://zmkgfmlcpzjfgxdmbtvi.supabase.co" crossorigin />
<link rel="dns-prefetch" href="https://zmkgfmlcpzjfgxdmbtvi.supabase.co" />
  <link rel="stylesheet" href="/css/tokens.css?v=20261108c" />
  <link rel="stylesheet" href="/css/components.css?v=20261108c" />
  <link rel="stylesheet" href="/css/app.css?v=20261108c" />
  <link rel="stylesheet" href="/css/views.css?v=20261108c" />
  <link rel="stylesheet" href="/css/admin.css?v=20261108c" />
<link rel="stylesheet" href="/css/theme-light.css?v=20261108c" />
<script>
/* The navigation keeps its width between visits, the same preference the
   dashboard uses. Set before the first frame so a remembered icon-rail does not
   flash a full-width column and then snap. */
(function () {
  try {
    document.documentElement.setAttribute(
      "data-sidebar",
      localStorage.getItem("shinzora:sidebar") === "rail" ? "rail" : "expanded"
    );
  } catch (error) { document.documentElement.setAttribute("data-sidebar", "expanded"); }
})();
</script>
<script>
/* The saved theme is applied before the first paint. A stylesheet swap after
   load would flash the dark theme at somebody who chose the light one, so this
   is the one script that has to run inline, ahead of everything else. */
(function () {
  try {
    var theme = localStorage.getItem("shinzora:theme");
    /* Keep this list in step with THEMES in js/ui/theme.js. It is here because
       it must run before the first paint; a module import would arrive after. */
    var themes = { midnight: "dark", blossom: "light", daylight: "light",
                   nebula: "dark", grove: "dark", porcelain: "light" };
    if (theme && themes[theme]) {
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.setAttribute("data-tone", themes[theme]);
    }
  } catch (error) { /* storage blocked: keep the default theme */ }
})();
</script>
</head>
<body class="admin">
  <!-- Access is decided server-side before this panel is ever shown. There is no
       sign-in form here: administrators use the standard sign-in page. -->
  <div class="admin-login" id="admin-gate" hidden>
    <div class="admin-login-card">
      <a class="nav-brand" href="/" aria-label="Shinzora home">
        <img class="brand-mark" src="/assets/icons/mark-96.png" alt="" width="26" height="26" decoding="async" />
        <span class="brand-word">SHINZORA</span>
        <span class="admin-brand-tag">Admin</span>
      </a>
      <h1 id="admin-gate-title">Checking access</h1>
      <p id="admin-gate-message">
        Verifying your administrator role with the server.
      </p>
      <div class="field-error" id="admin-gate-error" role="alert" aria-live="polite"></div>
      <a class="btn btn-primary btn-block" id="admin-gate-primary" href="/auth/login/?next=/admin/" hidden>Go to sign in</a>
      <a class="btn btn-ghost btn-sm btn-block" id="admin-gate-secondary" href="/app/" hidden>Open your workspace</a>
    </div>
  </div>

  <div class="admin-shell" id="admin-shell" hidden>
    <aside class="admin-sidebar" id="admin-sidebar">
      <div class="admin-brand">
        <img class="brand-mark" src="/assets/icons/mark-96.png" alt="" width="26" height="26" decoding="async" />
        <span class="brand-word">SHINZORA</span>
        <span class="admin-brand-tag">Admin</span>
        <button class="admin-drawer-close" data-admin-close data-sidebar-close aria-label="Close navigation">
          <i data-icon="x" data-size="16"></i>
        </button>
      </div>
      <nav id="admin-nav" aria-label="Admin sections"></nav>
      <div class="admin-sidebar-foot">
        <div id="admin-identity">—</div>
        <div style="margin-top:8px;display:flex;gap:10px">
          <a href="/app/">Dashboard</a>
          <a href="/">Website</a>
          <button class="btn btn-ghost btn-sm" id="admin-signout" style="padding:0;font-size:inherit;color:inherit">Sign out</button>
        </div>
      </div>
    </aside>

    <div class="admin-scrim" id="admin-scrim"></div>

    <div class="admin-main">
      <header class="admin-topbar">
        <button class="icon-btn admin-menu-toggle" id="admin-menu-toggle" aria-label="Toggle navigation" aria-expanded="false">
          <i data-icon="menu"></i>
        </button>
        <div class="admin-search">
          <i data-icon="search"></i>
          <input id="admin-search" type="search" placeholder="Search customers, payments, tickets" aria-label="Search" />
        </div>
        <div class="admin-who">
          <span class="badge badge-brand" id="admin-role">admin</span>
          <span id="admin-email-label">—</span>
          <span id="admin-avatar" aria-hidden="true"></span>
        </div>
      </header>

      <main class="admin-body" id="admin-root" aria-live="polite"></main>
    </div>
  </div>

  <script src="/js/vendor/supabase-js.js" defer></script>
  <script type="module" src="/js/boot/admin.js?v=20261108c"></script>
</body>
</html>
