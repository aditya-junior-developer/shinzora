<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You are offline — Shinzora</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#08070e" />
<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/css/tokens.css?v=20261110k" />
<link rel="stylesheet" href="/css/components.css?v=20261110k" />
<style>
  .of-shell { min-height: 100dvh; display: grid; place-items: center; padding: var(--s-8) var(--gutter); text-align: center; }
  .of-card { max-width: 460px; display: flex; flex-direction: column; align-items: center; gap: var(--s-4); }
  .of-mark { width: 56px; height: 56px; display: grid; place-items: center; border-radius: var(--r-lg); border: 1px solid var(--line-violet); background: rgba(124, 58, 237, 0.12); color: var(--violet-soft); }
  .of-status { display: inline-flex; align-items: center; gap: 7px; font-size: var(--fs-xs); color: var(--warn); }
  .of-status i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse-soft 1.6s infinite; }
  .of-status.online { color: var(--ok); }
</style>
</head>
<body>
<div class="atmosphere" aria-hidden="true"></div>
<main class="of-shell">
  <div class="of-card">
    <img src="/assets/icons/mark.svg" alt="Shinzora" width="48" height="48" />
    <div class="of-mark" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 8.8a16 16 0 0 1 20 0"/><path d="M5 12.6a11 11 0 0 1 14 0"/><path d="M8.5 16.4a6 6 0 0 1 7 0"/><path d="M12 20h.01"/><path d="m3 3 18 18"/></svg>
    </div>
    <h1 style="font-size:var(--fs-h3)">You are offline</h1>
    <p class="lead" style="font-size:var(--fs-body)">
      Shinzora needs a connection for AI generation, deployments and live business data. Pages you already visited and
      the app shell are cached, but nothing new can be created until you are back online.
    </p>
    <p class="of-status" id="net-status"><i></i> Waiting for the network</p>
    <button class="btn btn-primary" id="retry">Try again</button>
  </div>
</main>
<script type="module" src="/js/boot/offline.js?v=20261110k"></script>
</body>
</html>
